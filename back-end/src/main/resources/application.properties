# Default Configuration for Spring Boot Backend
spring.application.name=Calculate Proporcional

# Database Configuration with Environment Overrides
spring.datasource.url=${DB_URL:jdbc:h2:mem:calcpropdb}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# Driver & Dialect Configuration (Overridden by DB_DRIVER and DB_DIALECT env vars if present)
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Profile logic: it will be overridden by SPRING_PROFILES_ACTIVE env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator Healthcheck configuration
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
