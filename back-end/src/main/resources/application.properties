# Default Configuration (Safe for Git)
spring.application.name=Calculate Proporcional

# Database Configuration with Defaults for CI/Development
spring.datasource.url=${DB_URL:jdbc:h2:mem:calcpropdb}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# Common Settings
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Profile logic: it will be overridden by SPRING_PROFILES_ACTIVE env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
