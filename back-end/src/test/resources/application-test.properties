# Test Environment Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:calcpropdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Active Profile for Test Execution is defined via @ActiveProfiles("test")

# CORS Configuration for Tests
cors.allowed-origins=http://localhost:5173
