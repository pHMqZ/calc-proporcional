name: Fullstack CI (UAT & Main)

# Dispara a esteira para PRs com alvo em uat OU main
on:
  pull_request:
    branches:
      - uat
      - main
    paths:
      - 'back-end/**'
      - 'front-end/**'

jobs:
  # Job 1: Testes do Backend (Java)
  backend-tests:
    name: Java Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven Tests
        run: ./mvnw test
        env:
          SPRING_PROFILES_ACTIVE: ${{ github.base_ref }}

  # Job 2: Testes do Frontend (React + Vitest)
  frontend-tests:
    name: React Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './front-end/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Tests
        run: npm test -- --run
