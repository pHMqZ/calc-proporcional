name: Fullstack CI (UAT & Main)

# Dispara a esteira para PRs com alvo em uat OU main
on:
  pull_request:
    branches:
      - uat
      - main
    paths:
      - 'back-end/**'
      - 'front-end/**'

jobs:
  # Executa exclusivamente os testes funcionais de ponta a ponta no Chrome
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: ./front-end
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (for Backend WebServer)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './front-end/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Chrome Only)
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Setup Pages
        uses: actions/configure-pages@v4
        if: always()

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: front-end/playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()

      - name: Publish Playwright Report Link
        if: always() && steps.deployment.outputs.page_url != ''
        run: |
          echo "### 🎭 Relatório dos Testes E2E (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "O relatório interativo foi hospedado com sucesso e está disponível online!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Acessar Relatório Playwright](<${{ steps.deployment.outputs.page_url }}>)**" >> $GITHUB_STEP_SUMMARY